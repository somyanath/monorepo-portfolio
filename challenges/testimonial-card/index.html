<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Testimonial Card | GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/favicon.ico" sizes="any" />
  </head>
  <body>
    <!-- Add your site or application content here -->
    <div class="container">
      <figure class="testimonial-card">
        <figcaption class="testimonial-author">
          <picture>
            <source srcset="img/profile-thumbnail.png" type="image/webp" />
            <img
              alt="Sarah Dole's profile picture"
              src="./img/profile-thumbnail.png"
              width="48"
              height="48"
            />
          </picture>
          <div class="testimonial-author-info">
            <div class="testimonial-author-name">Sarah Dole</div>
            <div class="testimonial-author-handle">@sarahdole</div>
          </div>
        </figcaption>
        <blockquote>
          <p>
            I've been searching for high-quality abstract images for my design
            projects, and I'm thrilled to have found this platform. The variety
            and depth of creativity are astounding!
          </p>
        </blockquote>
      </figure>
    </div>
  </body>
</html>
